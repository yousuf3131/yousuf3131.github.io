<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YK Portfolio</title>
    <!-- Google Fonts: Inter for modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-04GNC61G4Z"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

<body class="home-page" style="position:relative; min-height:100vh;">
    <!-- Floating Decorative Shapes -->
    <div class="floating-shape green"></div>
    <div class="floating-shape yellow"></div>
    <div class="floating-shape purple"></div>

    <div id="navbar"></div>
    <script>
        fetch('components/navbar.html')
            .then(response => response.text())
            .then(data => document.getElementById('navbar').innerHTML = data);
    </script>

    <main>
        <!-- Modern Hero Section -->
        <section id="hero" class="flex-between" style="min-height:80vh; align-items:center; position:relative; z-index:1;">
            <!-- Left: Text -->
            <div style="flex:1; min-width:320px; max-width:520px; padding:2rem 0 2rem 2rem;">
                <div style="font-size:1.1rem; color:var(--secondary-color); margin-bottom:1.2rem; letter-spacing:0.5px;">HI THERE <span aria-label="wave" role="img">👋</span> I'M</div>
                <h1 class="section-title" style="font-size:3.2rem; line-height:1.1; margin-bottom:0.5rem;">Yousuf<br>Kazmi</h1>
                <div style="font-size:1.2rem; font-weight:700; color:var(--accent-color); margin-bottom:0.7rem; letter-spacing:0.5px;">
                    FULL STACK DEVELOPER <span aria-label="laptop" role="img">💻</span>
                </div>
                <p style="color:var(--secondary-color); font-size:1.08rem; margin-bottom:2.2rem; max-width:400px;">
                    I'm a passionate developer with a love for building seamless digital experiences. I specialize in both frontend and backend development, using modern web technologies to solve real-world problems.
                </p>
                <a href="mailto:yousufkazmi3131@gmail.com" class="button" style="font-size:1.15rem;">Hire Me</a>
            </div>
            <!-- Right: Avatar -->
            <div style="flex:1; display:flex; align-items:center; justify-content:center; min-width:280px;">
                <img src="assets/DeskMan.jpg" alt="Yousuf Kazmi Avatar" style="width:340px; height:340px; border-radius:50%; object-fit:cover; box-shadow:0 8px 32px rgba(0,0,0,0.18); background:#232427;">
            </div>
        </section>
        <!-- (Optional) Add more sections below as needed -->
    </main>

    <!-- Footer (loaded via JS) -->
    <div id="footer"></div>
    <script src="js/typeCodeAnimation.js"></script>
    <script src="js/expandMore.js"></script>
    <script>
        fetch('components/footer.html')
            .then(response => response.text())
            .then(data => document.getElementById('footer').innerHTML = data);
    </script>
</body>
</html>
