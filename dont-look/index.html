<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Don't Look</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<canvas id="c"></canvas>

<!-- Screen overlays -->
<div id="vignette"></div>
<canvas id="static-overlay"></canvas>

<!-- Screens -->
<div id="menu" class="screen">
  <div class="panel">
    <div class="title-wrap">
      <h1 class="game-title">DON'T<br>LOOK</h1>
      <p class="tagline">It only moves when you look away.</p>
    </div>
    <div class="menu-form">
      <input id="name" type="text" maxlength="20" placeholder="Your name" autocomplete="off" spellcheck="false">
      <div class="menu-row">
        <button id="btn-create" class="btn btn-primary">Create Room</button>
        <button id="btn-solo" class="btn btn-primary">Play Solo</button>
      </div>
      <div class="join-row">
        <input id="code" type="text" maxlength="5" placeholder="ROOM CODE" autocomplete="off" spellcheck="false" class="code-input">
        <button id="btn-join" class="btn">Join</button>
      </div>
      <p id="invite" class="invite hidden"></p>
      <p id="menu-status" class="status"></p>
    </div>
  </div>
  <button id="btn-mute" class="btn-icon mute-btn" type="button" title="Toggle sound">
    <svg id="icon-sound" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    <svg id="icon-muted" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hidden"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
  </button>
</div>

<div id="lobby" class="screen hidden">
  <div class="panel">
    <div class="lobby-header">
      <h2>Don't Look</h2>
      <div class="room-info">
        <span id="room-code" class="room-code">-----</span>
        <button id="btn-copy" class="btn btn-sm" type="button">Copy Link</button>
        <span id="count" class="player-count">1/8</span>
      </div>
    </div>
    <ul id="players" class="player-list"></ul>
    <div class="lobby-actions">
      <button id="btn-bot" class="btn host-only" type="button">Add Bot</button>
      <button id="btn-ready" class="btn client-only" type="button">Ready</button>
      <button id="btn-start" class="btn btn-primary host-only" type="button">Start Game</button>
    </div>
    <p id="lobby-status" class="status"></p>
  </div>
  <button id="btn-exit" class="btn btn-back" type="button">← Back</button>
  <button id="btn-mute2" class="btn-icon mute-btn" type="button">
    <svg id="icon-sound2" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    <svg id="icon-muted2" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hidden"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
  </button>
</div>

<!-- HUD (visible during game) -->
<div id="hud" class="hidden">
  <!-- Rituals top center -->
  <div id="rituals-hud">
    <div class="ritual-icon" id="ri-0" title="Ritual 1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>
    </div>
    <div class="ritual-icon" id="ri-1" title="Ritual 2">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>
    </div>
    <div class="ritual-icon" id="ri-2" title="Ritual 3">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>
    </div>
  </div>

  <!-- Flashlight battery top right -->
  <div id="battery-hud">
    <span class="hud-label">LIGHT</span>
    <div id="battery-bar-wrap">
      <div id="battery-bar"></div>
    </div>
  </div>

  <!-- Looking indicator bottom right -->
  <div id="looking-hud">
    <div id="eye-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </div>
    <span id="eye-label">WATCHING</span>
  </div>

  <!-- Fear meter bottom center -->
  <div id="fear-hud">
    <span class="hud-label">FEAR</span>
    <div id="fear-bar-wrap"><div id="fear-bar"></div></div>
  </div>

  <!-- Players list bottom left -->
  <div id="players-hud"></div>

  <!-- Ritual progress bar (for active ritual) -->
  <div id="ritual-progress-wrap" class="hidden">
    <div id="ritual-progress-bar"></div>
    <span>Activating ritual…</span>
  </div>

  <!-- Center messages -->
  <div id="center-msg"></div>

  <!-- Interaction prompt -->
  <div id="interact-prompt" class="hidden">Press <kbd>E</kbd> to activate ritual</div>

  <!-- Crosshair -->
  <div id="crosshair"></div>

  <!-- Touch controls -->
  <div id="joy-left" class="joy hidden"><div id="joy-left-knob"></div></div>
  <div id="joy-right" class="joy hidden"><div id="joy-right-knob"></div></div>
  <button id="touch-interact" class="touch-btn hidden" type="button">ACTIVATE</button>
  <button id="btn-mute-hud" class="btn-icon mute-btn hud-mute" type="button">
    <svg id="icon-sound-hud" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    <svg id="icon-muted-hud" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hidden"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
  </button>
</div>

<!-- Results screen -->
<div id="results" class="screen hidden">
  <div class="panel">
    <h2 id="results-title">Game Over</h2>
    <ul id="results-list"></ul>
    <div class="results-actions host-only">
      <button id="btn-again" class="btn btn-primary" type="button">Play Again</button>
    </div>
  </div>
  <button id="btn-results-exit" class="btn btn-back" type="button">← Leave</button>
</div>

<!-- Toasts -->
<div id="toasts"></div>

<!-- Click-to-lock overlay (shown when pointer not locked) -->
<div id="lock-prompt" class="hidden">
  <div class="lock-box">
    <p>Click to capture mouse</p>
    <p class="lock-sub">WASD to move · Mouse to look · E to activate</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module" src="js/main.js?v=2"></script>
</body>
</html>
