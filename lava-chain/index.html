<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../js/analytics.js?v=2"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lava Chain - Yousuf Kazmi</title>
    <meta name="description" content="A multiplayer platformer for up to 8 players. You're chained to a partner. The lava rises. Don't fall — or you'll drag them down with you.">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js" defer></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
            }
        }
    </script>
    <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
    <canvas id="c"></canvas>

    <!-- ── Menu ─────────────────────────────────────────────── -->
    <div id="menu" class="screen">
        <div class="panel menu-panel">
            <div class="title-wrap">
                <h1 class="game-title display">LAVA<br>CHAIN</h1>
                <p class="tagline">You're chained to your partner.<br>The lava rises. Don't fall — or drag them down.</p>
            </div>
            <div class="menu-form">
                <label>YOUR NAME</label>
                <input id="name" class="field" type="text" maxlength="16" placeholder="Player" autocomplete="off" spellcheck="false">
                <button id="btn-solo" class="btn primary big">Play Solo</button>
                <div class="divider">OR</div>
                <button id="btn-host" class="btn big">Host Game</button>
                <div class="join-row">
                    <input id="code" class="field" type="text" maxlength="5" placeholder="CODE" autocomplete="off" spellcheck="false">
                    <button id="btn-join" class="btn primary">Join</button>
                </div>
                <p id="menu-status" class="status"></p>
            </div>
        </div>
        <button id="btn-mute" class="btn small icon-btn" title="Toggle sound">♪</button>
    </div>

    <!-- ── Lobby ─────────────────────────────────────────────── -->
    <div id="lobby" class="screen hidden">
        <div class="panel lobby-panel">
            <div class="lobby-header">
                <span class="kicker">LOBBY</span>
                <span id="lobby-code" class="code-display"></span>
            </div>
            <div id="players" class="player-list"></div>
            <div class="lobby-actions">
                <button id="btn-start" class="btn primary big host-only">Start Game</button>
                <p id="lobby-status" class="status"></p>
            </div>
        </div>
        <button id="btn-exit" class="btn small icon-btn" title="Leave">✕</button>
    </div>

    <!-- ── HUD ───────────────────────────────────────────────── -->
    <div id="hud" class="hidden">
        <div id="hud-top">
            <div id="lava-warn"></div>
        </div>
        <div id="hud-chain">
            <div id="chain-bar-wrap">
                <div id="chain-bar-fill"></div>
            </div>
            <span id="chain-label">CHAIN</span>
        </div>
        <div id="hud-players"></div>
        <div id="countdown" class="hidden"></div>
        <div id="hud-height">
            <span id="height-val">0</span><span class="height-unit">m</span>
        </div>
    </div>

    <!-- ── Results ───────────────────────────────────────────── -->
    <div id="results" class="screen hidden">
        <div class="panel results-panel">
            <h2 id="results-title" class="display"></h2>
            <ul id="results-list"></ul>
            <div class="results-actions">
                <button id="btn-results-lobby" class="btn primary big host-only">Back to Lobby</button>
                <button id="btn-results-exit" class="btn big">Leave</button>
            </div>
        </div>
    </div>

    <!-- ── Touch controls ────────────────────────────────────── -->
    <div id="touch-controls" class="hidden">
        <div id="joy-zone-l"></div>
        <button id="btn-jump" class="touch-btn">▲</button>
    </div>

    <script type="module" src="js/main.js?v=1"></script>
</body>
</html>
