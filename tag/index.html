<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tag Royale - Yousuf Kazmi</title>
    <meta name="description" content="Online multiplayer tag game for up to 8 players. Run, dodge, and survive!">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1">
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js" defer></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <canvas id="c"></canvas>
    <div class="corner">
        <button class="btn" id="btn-mute" type="button" aria-label="Toggle sound">
            <svg id="icon-sound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
            <svg id="icon-muted" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
        </button>
        <button class="btn" id="btn-exit" type="button">Exit</button>
    </div>

    <div id="menu" class="screen">
        <div class="panel menu-panel">
            <div class="logo">TAG<span>ROYALE</span></div>
            <p class="tagline">One player is "it" - tag others to grow your team. Last survivor wins!</p>
            <div id="invite" class="invite hidden"></div>
            <div class="menu-form">
                <label for="name">Your name</label>
                <input class="field" id="name" maxlength="14" autocomplete="nickname" placeholder="e.g. Flash">
                <button class="btn primary big" id="btn-create" type="button">Create a room</button>
                <div class="divider">OR JOIN A FRIEND</div>
                <div class="join-row">
                    <input class="field" id="code" maxlength="5" placeholder="CODE" autocomplete="off" spellcheck="false">
                    <button class="btn" id="btn-join" type="button">Join</button>
                </div>
                <button class="btn big" id="btn-solo" type="button">Play solo against bots</button>
            </div>
            <div id="menu-status" class="status"></div>
        </div>
    </div>

    <div id="lobby" class="screen hidden">
        <div class="panel lobby-panel">
            <div class="room-box">
                <small>Room code</small>
                <div class="room-code" id="room-code">-----</div>
                <button class="btn" id="btn-copy" type="button">Copy invite link</button>
            </div>
            <div class="section-title">Players <small id="count">1/8</small></div>
            <ul class="players" id="players"></ul>
            <div class="lobby-actions">
                <button class="btn host-only" id="btn-bot" type="button">Add a bot</button>
                <button class="btn primary big client-only" id="btn-ready" type="button">Ready up</button>
                <button class="btn primary big host-only" id="btn-start" type="button">Start game</button>
                <div id="lobby-status" class="status"></div>
            </div>
        </div>
    </div>

    <div id="hud" class="hidden">
        <div class="hud-tl">
            <div class="round-info"><span class="chip">Round <b id="round-num">1/3</b></span></div>
            <div class="role-badge" id="role-badge">RUN!</div>
            <div class="timer-display"><span id="timer">90</span>s</div>
            <div class="survivor-count" id="survivor-count">7 survivors</div>
            <div class="player-tags" id="player-tags"></div>
        </div>
        <div id="center-msg"></div>
        <div class="hud-bottom">
            <div class="stamina-bar"><div class="stamina-fill" id="stamina-fill"></div><span>Stamina</span></div>
            <div id="dodge-cd">
                <div class="ring">
                    <svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="5"/><circle id="cd-ring" cx="26" cy="26" r="22" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="0"/></svg>
                    <span>SPACE</span>
                </div>
                <div><b>Dodge</b></div>
            </div>
        </div>
        <div id="powerup-hud" class="hidden"><span id="powerup-icon"></span></div>
        <div id="joy"><div id="joy-knob"></div></div>
        <button id="touch-dodge" type="button">DODGE</button>
        <button id="touch-sprint" type="button">SPRINT</button>
    </div>

    <div id="results" class="screen dim hidden">
        <div class="panel results-panel">
            <div class="kicker">Game over</div>
            <h2 id="results-title">Results</h2>
            <ol class="results-list" id="results-list"></ol>
            <div class="results-actions">
                <button class="btn primary host-only" id="btn-again" type="button">Back to the lobby</button>
                <span class="status client-only">Waiting for the host...</span>
            </div>
        </div>
    </div>

    <div id="toasts"></div>
    <script type="module" src="js/main.js?v=1"></script>
</body>
</html>
