<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Yousuf Kazmi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/site.css">
    <script src="js/site.js"></script>
</head>
<body>
    <header id="site-header"></header>

    <main>
        <section class="page-head">
            <div class="container">
                <span class="eyebrow">Contact</span>
                <h1>Let's work together</h1>
                <p>Have a project, a role or just a question? Send me a message and I'll get back to you.</p>
            </div>
        </section>

        <section class="section" style="padding-top:0;">
            <div class="container contact-layout">
                <ul class="contact-list">
                    <li><a href="mailto:yousufkazmi3131@gmail.com"><span data-icon="mail"></span>yousufkazmi3131@gmail.com</a></li>
                    <li><a href="https://www.linkedin.com/in/yousufkazmi/" target="_blank" rel="noopener"><span data-icon="linkedin"></span>LinkedIn</a></li>
                    <li><a href="https://github.com/yousuf3131" target="_blank" rel="noopener"><span data-icon="github"></span>GitHub</a></li>
                </ul>

                <form action="https://formspree.io/f/xovqqlqp" method="POST" class="card">
                    <div class="field">
                        <label for="email">Your email</label>
                        <input type="email" id="email" name="email" required autocomplete="email">
                    </div>
                    <div class="field">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;">Send message</button>
                </form>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>
</body>
</html>
