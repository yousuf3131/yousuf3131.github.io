<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a9a72"/>
      <stop offset="1" stop-color="#11493a"/>
    </linearGradient>
    <pattern id="tiles" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#ffffff" opacity="0.045"/>
      <rect x="22" y="22" width="22" height="22" fill="#ffffff" opacity="0.045"/>
    </pattern>
    <radialGradient id="glow" cx="0.3" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#7fffd0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7fffd0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6aa8ff"/>
      <stop offset="1" stop-color="#2d6ae0"/>
    </linearGradient>
    <linearGradient id="enemy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a7e"/>
      <stop offset="1" stop-color="#d4463d"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a7488"/>
      <stop offset="1" stop-color="#474f60"/>
    </linearGradient>
  </defs>

  <!-- Arena floor -->
  <rect width="660" height="300" fill="url(#bg)"/>
  <rect width="660" height="300" fill="url(#tiles)"/>
  <rect width="660" height="300" fill="url(#glow)"/>

  <!-- Walls -->
  <rect x="0" y="0" width="660" height="26" fill="url(#wall)"/>
  <rect x="0" y="26" width="660" height="6" fill="#000" opacity="0.18"/>
  <rect x="0" y="0" width="22" height="300" fill="url(#wall)"/>
  <rect x="22" y="26" width="6" height="274" fill="#000" opacity="0.14"/>
  <rect x="560" y="26" width="54" height="80" rx="4" fill="url(#wall)"/>
  <rect x="560" y="106" width="54" height="8" fill="#000" opacity="0.18"/>

  <!-- Ricochet shot -->
  <path d="M224 88 L302 31 L386 92" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12" opacity="0.85"/>
  <circle cx="302" cy="32" r="7" fill="#fff4c8" opacity="0.9"/>
  <circle cx="302" cy="32" r="14" fill="#ffd166" opacity="0.25"/>

  <!-- Enemy tank -->
  <g transform="translate(424 118) rotate(150)">
    <ellipse cx="4" cy="-6" rx="40" ry="34" fill="#000" opacity="0.16"/>
    <rect x="-34" y="-30" width="68" height="14" rx="7" fill="#23272e"/>
    <rect x="-34" y="16" width="68" height="14" rx="7" fill="#23272e"/>
    <rect x="-30" y="-20" width="60" height="40" rx="10" fill="url(#enemy)"/>
    <rect x="10" y="-5" width="36" height="10" rx="4" fill="#c23f37"/>
    <circle r="15" fill="#ff9a8f"/>
    <circle r="6" fill="#c23f37"/>
  </g>
  <!-- Hit burst -->
  <g transform="translate(392 96)" fill="#ffd166">
    <path d="M0 -20 L5 -6 L20 -8 L8 2 L14 16 L0 8 L-14 16 L-8 2 L-20 -8 L-5 -6 Z" opacity="0.95"/>
    <circle r="6" fill="#fff6d8"/>
  </g>

  <!-- Player tank -->
  <ellipse cx="154" cy="186" rx="70" ry="18" fill="#000" opacity="0.22"/>
  <g transform="translate(150 154) scale(0.8) rotate(-12)">
    <rect x="-72" y="-56" width="144" height="28" rx="13" fill="#20242b"/>
    <rect x="-72" y="28" width="144" height="28" rx="13" fill="#20242b"/>
    <g stroke="#3a404b" stroke-width="3">
      <path d="M-52 -54v24M-30 -54v24M-8 -54v24M14 -54v24M36 -54v24M58 -54v24"/>
      <path d="M-52 30v24M-30 30v24M-8 30v24M14 30v24M36 30v24M58 30v24"/>
    </g>
    <rect x="-64" y="-38" width="128" height="76" rx="18" fill="url(#hull)"/>
    <rect x="-56" y="-32" width="112" height="16" rx="8" fill="#ffffff" opacity="0.18"/>
    <!-- Turret aimed up-right -->
    <g transform="rotate(-28)">
      <rect x="18" y="-10" width="84" height="20" rx="7" fill="#3d7ef0"/>
      <rect x="96" y="-13" width="16" height="26" rx="5" fill="#2451b8"/>
      <circle r="32" fill="#7bb4ff"/>
      <circle r="32" fill="none" stroke="#2d6ae0" stroke-width="4"/>
      <circle cx="-6" cy="-4" r="12" fill="#2d6ae0"/>
      <circle cx="-10" cy="-14" r="10" fill="#ffffff" opacity="0.25"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="'Arial Black', 'Segoe UI Black', Impact, sans-serif" font-weight="900">
    <text x="636" y="262" text-anchor="end" font-size="92" letter-spacing="2" fill="#000" opacity="0.25">TANKS</text>
    <text x="630" y="256" text-anchor="end" font-size="92" letter-spacing="2" fill="#ffffff">TANKS</text>
    <text x="630" y="284" text-anchor="end" font-size="15" letter-spacing="5" fill="#9dffd9">3D CAMPAIGN</text>
  </g>
</svg>
