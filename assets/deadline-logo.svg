<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="32" fill="#020210"/>
  <!-- Grid floor -->
  <g stroke="#00ccff" stroke-opacity="0.15" stroke-width="0.5">
    <line x1="20" y1="60" x2="180" y2="60"/><line x1="20" y1="80" x2="180" y2="80"/>
    <line x1="20" y1="100" x2="180" y2="100"/><line x1="20" y1="120" x2="180" y2="120"/>
    <line x1="20" y1="140" x2="180" y2="140"/><line x1="20" y1="160" x2="180" y2="160"/>
    <line x1="40" y1="50" x2="40" y2="170"/><line x1="60" y1="50" x2="60" y2="170"/>
    <line x1="80" y1="50" x2="80" y2="170"/><line x1="100" y1="50" x2="100" y2="170"/>
    <line x1="120" y1="50" x2="120" y2="170"/><line x1="140" y1="50" x2="140" y2="170"/>
    <line x1="160" y1="50" x2="160" y2="170"/>
  </g>
  <!-- Trail 1 (cyan) -->
  <path d="M40 150 L40 90 L100 90" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 150 L40 90 L100 90" fill="none" stroke="#00e5ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.2"/>
  <!-- Cycle 1 -->
  <rect x="96" y="86" width="12" height="8" rx="2" fill="#00e5ff"/>
  <rect x="108" y="87" width="5" height="6" rx="1" fill="#00e5ff" opacity="0.7"/>
  <!-- Trail 2 (magenta) -->
  <path d="M160 160 L160 120 L110 120 L110 70" fill="none" stroke="#ff0055" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M160 160 L160 120 L110 120 L110 70" fill="none" stroke="#ff0055" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.2"/>
  <!-- Cycle 2 -->
  <rect x="106" y="62" width="8" height="12" rx="2" fill="#ff0055"/>
  <rect x="107" y="56" width="6" height="5" rx="1" fill="#ff0055" opacity="0.7"/>
  <!-- Trail 3 (green) -->
  <path d="M60 170 L60 140 L130 140" fill="none" stroke="#39ff14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 170 L60 140 L130 140" fill="none" stroke="#39ff14" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.2"/>
  <!-- Cycle 3 -->
  <rect x="126" y="136" width="12" height="8" rx="2" fill="#39ff14"/>
  <!-- Title -->
  <text x="100" y="38" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="26" fill="#00e5ff">DEADLINE</text>
</svg>
