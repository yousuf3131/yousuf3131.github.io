<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#01010f"/><stop offset="1" stop-color="#020820"/></linearGradient>
    <radialGradient id="dglow1" cx="0.38" cy="0.72" r="0.42"><stop offset="0" stop-color="#00e5ff" stop-opacity="0.18"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="dglow2" cx="0.72" cy="0.44" r="0.38"><stop offset="0" stop-color="#ff0055" stop-opacity="0.16"/><stop offset="1" stop-color="#ff0055" stop-opacity="0"/></radialGradient>
    <radialGradient id="dglow3" cx="0.5" cy="0.6" r="0.35"><stop offset="0" stop-color="#39ff14" stop-opacity="0.14"/><stop offset="1" stop-color="#39ff14" stop-opacity="0"/></radialGradient>
    <filter id="dfb"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="dfs"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="660" height="300" fill="url(#dbg)"/>

  <!-- Neon ambient pools -->
  <rect width="660" height="300" fill="url(#dglow1)"/>
  <rect width="660" height="300" fill="url(#dglow2)"/>
  <rect width="660" height="300" fill="url(#dglow3)"/>

  <!-- Perspective grid floor (horizon at y=130) -->
  <g stroke="#00ccff" stroke-opacity="0.1" stroke-width="0.7">
    <!-- Horizontal lines (diminishing toward horizon) -->
    <line x1="0" y1="300" x2="660" y2="300"/>
    <line x1="0" y1="260" x2="660" y2="260"/>
    <line x1="20" y1="230" x2="640" y2="230"/>
    <line x1="60" y1="208" x2="600" y2="208"/>
    <line x1="100" y1="192" x2="560" y2="192"/>
    <line x1="140" y1="180" x2="520" y2="180"/>
    <line x1="180" y1="170" x2="480" y2="170"/>
    <line x1="210" y1="163" x2="450" y2="163"/>
    <line x1="240" y1="157" x2="420" y2="157"/>
    <line x1="260" y1="152" x2="400" y2="152"/>
    <line x1="280" y1="148" x2="380" y2="148"/>
    <line x1="295" y1="145" x2="365" y2="145"/>
    <!-- Vertical perspective lines -->
    <line x1="330" y1="130" x2="0" y2="300"/>
    <line x1="330" y1="130" x2="110" y2="300"/>
    <line x1="330" y1="130" x2="220" y2="300"/>
    <line x1="330" y1="130" x2="330" y2="300"/>
    <line x1="330" y1="130" x2="440" y2="300"/>
    <line x1="330" y1="130" x2="550" y2="300"/>
    <line x1="330" y1="130" x2="660" y2="300"/>
  </g>

  <!-- Boundary walls (left and right) -->
  <rect x="0" y="130" width="18" height="170" fill="#001428" stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>
  <rect x="642" y="130" width="18" height="170" fill="#001428" stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>
  <!-- Top boundary -->
  <rect x="0" y="120" width="660" height="14" fill="#001428" stroke="#00ccff" stroke-width="1.5" opacity="0.6"/>

  <!-- CYAN trail (player 1 — complex path) -->
  <path d="M 80 285 L 80 210 L 240 210 L 240 170 L 420 170 L 420 200 L 530 200" fill="none" stroke="#00e5ff" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter" opacity="0.25" filter="url(#dfs)"/>
  <path d="M 80 285 L 80 210 L 240 210 L 240 170 L 420 170 L 420 200 L 530 200" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Cyan cycle at current position -->
  <g transform="translate(530 200)">
    <rect x="-18" y="-6" width="24" height="12" rx="2" fill="#00e5ff"/>
    <rect x="4" y="-8" width="10" height="16" rx="2" fill="#00b8d4"/>
    <rect x="-18" y="-8" width="6" height="4" rx="1" fill="#80f0ff"/>
    <rect x="-22" y="-4" width="6" height="8" rx="1" fill="#00e5ff" opacity="0.7"/>
    <circle cx="-15" cy="8" r="3" fill="#005a6b"/>
    <circle cx="6" cy="8" r="3" fill="#005a6b"/>
  </g>
  <!-- Cyan glow dot at tip -->
  <circle cx="530" cy="200" r="14" fill="#00e5ff" opacity="0.3" filter="url(#dfs)"/>

  <!-- MAGENTA trail (player 2) -->
  <path d="M 580 285 L 580 240 L 400 240 L 400 175 L 200 175 L 200 215 L 90 215" fill="none" stroke="#ff0055" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter" opacity="0.22" filter="url(#dfs)"/>
  <path d="M 580 285 L 580 240 L 400 240 L 400 175 L 200 175 L 200 215 L 90 215" fill="none" stroke="#ff0055" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Magenta cycle -->
  <g transform="translate(90 215) rotate(180)">
    <rect x="-18" y="-6" width="24" height="12" rx="2" fill="#ff0055"/>
    <rect x="4" y="-8" width="10" height="16" rx="2" fill="#cc0044"/>
    <rect x="-18" y="-8" width="6" height="4" rx="1" fill="#ff80aa"/>
    <circle cx="-15" cy="8" r="3" fill="#550020"/>
    <circle cx="6" cy="8" r="3" fill="#550020"/>
  </g>
  <circle cx="90" cy="215" r="14" fill="#ff0055" opacity="0.28" filter="url(#dfs)"/>

  <!-- GREEN trail (player 3) -->
  <path d="M 160 285 L 160 255 L 370 255 L 370 190" fill="none" stroke="#39ff14" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter" opacity="0.2" filter="url(#dfs)"/>
  <path d="M 160 285 L 160 255 L 370 255 L 370 190" fill="none" stroke="#39ff14" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Green cycle (heading up) -->
  <g transform="translate(370 190) rotate(-90)">
    <rect x="-18" y="-6" width="24" height="12" rx="2" fill="#39ff14"/>
    <rect x="4" y="-8" width="10" height="16" rx="2" fill="#28cc0e"/>
    <rect x="-18" y="-8" width="6" height="4" rx="1" fill="#9cff80"/>
    <circle cx="-15" cy="8" r="3" fill="#0f4a04"/>
    <circle cx="6" cy="8" r="3" fill="#0f4a04"/>
  </g>
  <circle cx="370" cy="190" r="14" fill="#39ff14" opacity="0.25" filter="url(#dfs)"/>

  <!-- Collision explosion (where cyan and magenta trails nearly meet) -->
  <g transform="translate(200 175)" opacity="0.9">
    <circle r="18" fill="#fff" opacity="0.8" filter="url(#dfs)"/>
    <circle r="10" fill="#ff8800"/>
    <g stroke="#ffff00" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="-20" x2="0" y2="-30"/>
      <line x1="14" y1="-14" x2="20" y2="-21"/>
      <line x1="20" y1="0" x2="30" y2="0"/>
      <line x1="14" y1="14" x2="20" y2="21"/>
      <line x1="0" y1="20" x2="0" y2="30"/>
      <line x1="-14" y1="14" x2="-20" y2="21"/>
      <line x1="-20" y1="0" x2="-30" y2="0"/>
      <line x1="-14" y1="-14" x2="-20" y2="-21"/>
    </g>
  </g>

  <!-- Sky gradient top -->
  <rect x="0" y="0" width="660" height="130" fill="url(#dbg)" opacity="0.4"/>

  <!-- Neon scanlines -->
  <g stroke="#00ccff" stroke-width="0.4" opacity="0.04">
    <line x1="0" y1="10" x2="660" y2="10"/><line x1="0" y1="20" x2="660" y2="20"/><line x1="0" y1="30" x2="660" y2="30"/>
    <line x1="0" y1="40" x2="660" y2="40"/><line x1="0" y1="50" x2="660" y2="50"/><line x1="0" y1="60" x2="660" y2="60"/>
    <line x1="0" y1="70" x2="660" y2="70"/><line x1="0" y1="80" x2="660" y2="80"/><line x1="0" y1="90" x2="660" y2="90"/>
    <line x1="0" y1="100" x2="660" y2="100"/><line x1="0" y1="110" x2="660" y2="110"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Arial Black','Segoe UI Black',Impact,sans-serif" font-weight="900" text-anchor="middle">
    <text x="330" y="90" font-size="72" letter-spacing="4" fill="#00e5ff" opacity="0.12" filter="url(#dfb)">DEADLINE</text>
    <text x="330" y="90" font-size="72" letter-spacing="4" fill="#000" opacity="0.35">DEADLINE</text>
    <text x="327" y="86" font-size="72" letter-spacing="4" fill="#00e5ff">DEADLINE</text>
    <text x="327" y="112" font-size="13" letter-spacing="8" fill="#00b8d4" opacity="0.9">NEON LIGHTCYCLE ARENA</text>
  </g>
</svg>
