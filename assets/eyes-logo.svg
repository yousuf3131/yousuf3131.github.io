<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#040509"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#e9b877" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e9b877" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38e1ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38e1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeball" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d6ee"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38e1ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#38e1ff" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="lit">
      <ellipse cx="190" cy="236" rx="150" ry="62"/>
    </clipPath>
  </defs>

  <!-- Night and a few specks of dust -->
  <rect width="660" height="300" fill="url(#bg)"/>
  <g fill="#ffe0b0" opacity="0.5">
    <circle cx="40" cy="60" r="1.5"/><circle cx="96" cy="120" r="1"/><circle cx="330" cy="40" r="1.2"/>
    <circle cx="300" cy="150" r="1"/><circle cx="620" cy="30" r="1.4"/><circle cx="600" cy="270" r="1"/>
    <circle cx="380" cy="260" r="1.2"/><circle cx="20" cy="250" r="1"/>
  </g>

  <!-- The course: tiles running into the dark, only visible where the lamp reaches -->
  <g fill="#161a24">
    <path d="M60 300 L150 172 L230 172 L320 300 Z"/>
  </g>
  <g clip-path="url(#lit)">
    <rect x="0" y="150" width="400" height="150" fill="url(#pool)"/>
    <g fill="#b9ad97" stroke="#3a3530" stroke-width="3">
      <path d="M92 300 L112 262 L160 262 L150 300 Z"/>
      <path d="M156 300 L164 262 L214 262 L224 300 Z"/>
      <path d="M230 300 L218 262 L266 262 L288 300 Z"/>
      <path d="M116 256 L132 226 L172 226 L166 256 Z"/>
      <path d="M172 256 L178 226 L210 226 L216 256 Z"/>
      <path d="M222 256 L214 226 L250 226 L262 256 Z"/>
      <path d="M136 220 L148 198 L180 198 L176 220 Z"/>
      <path d="M182 220 L186 198 L208 198 L210 220 Z"/>
      <path d="M216 220 L212 198 L236 198 L246 220 Z"/>
    </g>
    <rect x="0" y="150" width="400" height="150" fill="url(#pool)" opacity="0.35"/>
  </g>
  <!-- A trap lurking just past the light -->
  <g opacity="0.35">
    <rect x="262" y="168" width="84" height="8" rx="4" fill="#ff7a1a"/>
    <circle cx="304" cy="172" r="9" fill="#3b4150"/>
  </g>

  <!-- Ping from the guide: an arrow marker on the path ahead -->
  <g>
    <rect x="183" y="96" width="14" height="92" fill="url(#beam)"/>
    <ellipse cx="190" cy="196" rx="26" ry="8" fill="none" stroke="#38e1ff" stroke-width="4"/>
    <circle cx="190" cy="118" r="20" fill="#08111e" stroke="#38e1ff" stroke-width="4"/>
    <path d="M190 104 L202 118 L195 118 L195 131 L185 131 L185 118 L178 118 Z" fill="#38e1ff"/>
  </g>

  <!-- The walker: a round little miner with a headlamp -->
  <g transform="translate(190 232)">
    <ellipse cx="0" cy="40" rx="30" ry="7" fill="#000" opacity="0.35"/>
    <rect x="-13" y="18" width="9" height="20" rx="4" fill="#3b2a4a"/>
    <rect x="4" y="18" width="9" height="20" rx="4" fill="#3b2a4a"/>
    <rect x="-17" y="34" width="15" height="7" rx="3" fill="#2a1f36"/>
    <rect x="2" y="34" width="15" height="7" rx="3" fill="#2a1f36"/>
    <ellipse cx="0" cy="6" rx="24" ry="24" fill="#ff8a3d"/>
    <ellipse cx="-26" cy="4" rx="6" ry="12" fill="#ff8a3d" transform="rotate(18 -26 4)"/>
    <ellipse cx="26" cy="4" rx="6" ry="12" fill="#ff8a3d" transform="rotate(-18 26 4)"/>
    <ellipse cx="0" cy="10" rx="14" ry="12" fill="#ffb070"/>
    <circle cx="0" cy="-26" r="20" fill="#ffb070"/>
    <path d="M-22 -30 A22 22 0 0 1 22 -30 L24 -26 L-24 -26 Z" fill="#ffd23f"/>
    <circle cx="0" cy="-36" r="6" fill="#fff4c4"/>
    <circle cx="0" cy="-36" r="12" fill="#fff4c4" opacity="0.3"/>
    <ellipse cx="-7" cy="-20" rx="4" ry="5" fill="#fff"/>
    <ellipse cx="7" cy="-20" rx="4" ry="5" fill="#fff"/>
    <circle cx="-6" cy="-19" r="2.2" fill="#0b0b12"/>
    <circle cx="8" cy="-19" r="2.2" fill="#0b0b12"/>
  </g>

  <!-- The eye watching over everything -->
  <g transform="translate(92 70)">
    <circle r="60" fill="url(#eyeGlow)"/>
    <ellipse rx="40" ry="26" fill="url(#eyeball)" stroke="#38e1ff" stroke-width="3"/>
    <circle cx="6" cy="4" r="16" fill="#38e1ff"/>
    <circle cx="6" cy="4" r="8" fill="#05070c"/>
    <circle cx="11" cy="-1" r="3.5" fill="#fff"/>
    <path d="M-40 0 Q0 -40 40 0" fill="none" stroke="#9fefff" stroke-width="3" opacity="0.7"/>
  </g>
  <!-- Its gaze: a dashed line down to the walker -->
  <path d="M120 96 Q150 150 172 196" fill="none" stroke="#38e1ff" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round" opacity="0.8"/>

  <!-- Wordmark -->
  <g font-family="'Arial Black', 'Segoe UI Black', Impact, sans-serif" font-weight="900" text-anchor="end">
    <text x="636" y="126" font-size="74" letter-spacing="2" fill="#000" opacity="0.4">EYES</text>
    <text x="630" y="120" font-size="74" letter-spacing="2" fill="#38e1ff">EYES</text>
    <text x="630" y="162" font-size="30" fill="#ffffff">&amp;</text>
    <text x="636" y="232" font-size="74" letter-spacing="2" fill="#000" opacity="0.4">LEGS</text>
    <text x="630" y="226" font-size="74" letter-spacing="2" fill="#ffc94a">LEGS</text>
    <text x="630" y="262" font-size="15" letter-spacing="5" fill="#cfe9ff">2-PLAYER CO-OP</text>
  </g>
</svg>
