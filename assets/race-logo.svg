<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a86d8"/>
      <stop offset="0.7" stop-color="#a9d2f5"/>
      <stop offset="1" stop-color="#ffd9b0"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4e56"/>
      <stop offset="1" stop-color="#2f3238"/>
    </linearGradient>
  </defs>

  <!-- Sky, hills, grass -->
  <rect width="660" height="300" fill="url(#sky)"/>
  <path d="M0 170 L70 120 L140 165 L230 105 L320 160 L410 115 L500 158 L580 110 L660 150 V200 H0 Z" fill="#8fb7a0"/>
  <rect y="168" width="660" height="132" fill="#5ea94f"/>

  <!-- Road in perspective with curbs -->
  <path d="M250 168 L410 168 L660 300 L0 300 Z" fill="url(#road)"/>
  <path d="M250 168 L236 168 L0 262 L0 300 Z" fill="#e0473f"/>
  <path d="M410 168 L424 168 L660 262 L660 300 Z" fill="#e0473f"/>
  <g fill="#f5f5f5">
    <path d="M245 176 L238 176 L200 191 L212 191 Z"/>
    <path d="M168 204 L152 204 L100 225 L118 225 Z"/>
    <path d="M60 240 L38 240 L0 256 L0 256 L20 256 Z"/>
    <path d="M415 176 L422 176 L460 191 L448 191 Z"/>
    <path d="M492 204 L508 204 L560 225 L542 225 Z"/>
    <path d="M600 240 L622 240 L660 256 L640 256 Z"/>
  </g>
  <g fill="#ffffff" opacity="0.8">
    <path d="M327 172 L333 172 L335 184 L325 184 Z"/>
    <path d="M324 196 L336 196 L339 216 L321 216 Z"/>
    <path d="M318 234 L342 234 L347 270 L313 270 Z"/>
  </g>

  <!-- Car, left, door flung open -->
  <g transform="translate(118 218)">
    <ellipse cx="60" cy="54" rx="72" ry="10" fill="#000" opacity="0.25"/>
    <rect x="0" y="4" width="120" height="40" rx="16" fill="#2ec495"/>
    <rect x="22" y="-24" width="70" height="34" rx="12" fill="#9fd0ff" opacity="0.9"/>
    <circle cx="48" cy="-6" r="9" fill="#f1c27d"/>
    <rect x="96" y="12" width="10" height="7" rx="2" fill="#fff3c4"/>
    <!-- open door swinging out -->
    <path d="M86 10 L128 -8 L132 26 L90 38 Z" fill="#26a57e" stroke="#1a7a5c" stroke-width="3"/>
    <circle cx="24" cy="44" r="14" fill="#1b1d22"/>
    <circle cx="24" cy="44" r="6" fill="#c9ced6"/>
    <circle cx="98" cy="44" r="14" fill="#1b1d22"/>
    <circle cx="98" cy="44" r="6" fill="#c9ced6"/>
  </g>

  <!-- Impact burst between them -->
  <g transform="translate(300 206)">
    <path d="M0 -38 L10 -12 L38 -18 L16 2 L32 28 L4 14 L-10 40 L-12 12 L-40 16 L-18 -4 L-32 -28 L-6 -14 Z" fill="#ffd166" stroke="#fff" stroke-width="3"/>
  </g>

  <!-- Moped rider, right, swinging a baguette -->
  <g transform="translate(410 176)">
    <ellipse cx="62" cy="96" rx="64" ry="9" fill="#000" opacity="0.25"/>
    <circle cx="20" cy="84" r="15" fill="#1b1d22"/>
    <circle cx="20" cy="84" r="6" fill="#c9ced6"/>
    <circle cx="104" cy="84" r="15" fill="#1b1d22"/>
    <circle cx="104" cy="84" r="6" fill="#c9ced6"/>
    <path d="M14 70 Q20 48 60 50 L96 50 Q112 52 110 72 L96 76 L30 76 Z" fill="#e0584f"/>
    <path d="M20 30 L30 78 L12 78 L6 34 Z" fill="#e0584f"/>
    <rect x="44" y="40" width="44" height="10" rx="5" fill="#f4efe6"/>
    <!-- rider -->
    <path d="M58 44 L52 8 Q60 -2 72 6 L76 44 Z" fill="#c23f37"/>
    <circle cx="58" cy="-6" r="13" fill="#f1c27d"/>
    <path d="M44 -8 A15 15 0 0 1 72 -10 L72 -4 L44 -4 Z" fill="#e0584f"/>
    <!-- baguette mid-swing toward the car -->
    <g transform="rotate(-38 52 12)">
      <rect x="-48" y="6" width="100" height="16" rx="8" fill="#d9a35b"/>
      <g stroke="#9c6a2e" stroke-width="3" stroke-linecap="round">
        <path d="M-34 10 L-28 18M-14 10 L-8 18M6 10 L12 18M26 10 L32 18"/>
      </g>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="'Arial Black', 'Segoe UI Black', Impact, sans-serif" font-weight="900" text-anchor="middle">
    <text x="334" y="80" font-size="68" letter-spacing="3" fill="#0b3b2c">BONK RACERS</text>
    <text x="330" y="76" font-size="68" letter-spacing="3" fill="#ffffff">BONK <tspan fill="#f2c14e">RACERS</tspan></text>
    <text x="330" y="106" font-size="14" letter-spacing="6" fill="#0f2a1f">ONLINE MULTIPLAYER · UP TO 8</text>
  </g>
</svg>
